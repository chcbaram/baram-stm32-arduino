#
# WEACT-H750-MINI external QSPI flash (W25Q64JV), for programming the sketch
# over SWD without involving the bootloader.
#
# Taken from the weact-h750-mini repository, tools/openocd/weact-h750-qspi.cfg,
# where it was written and verified on hardware:
#
#   flash1 'win w25q64fv/jv' id = 0x1740ef size = 8192 KiB
#   erase 64K in 0.258s (247 KiB/s); write, verify and re-erase all pass
#
# Two things this file exists to get right, both found the hard way:
#
#   - SRST cannot be used on this board. NRST is driven by a MAX809TEUR
#     supervisor, so the adapter pulling it does not give OpenOCD a halt it can
#     time ("timed out while waiting for target halted"). reset_config none
#     makes it use SYSRESETREQ instead, which also preserves the backup domain
#     and so leaves the bootloader's boot mode flag intact.
#   - OpenOCD's stmqspi erases in 64 KB units regardless of the 4 KB subsectors
#     the part supports, so it cannot invalidate the 4 KB tag sector on its own.
#
# This is the recovery path, for when the bootloader is broken or USB will not
# come up. The normal routes are the CDC uploader and UF2 drag and drop.
#
source [find interface/stlink.cfg]

# The transport is deliberately not pinned. interface/stlink.cfg selects a
# different adapter driver depending on which OpenOCD build is running - "hla"
# (transport hla_swd) in the xpack and Homebrew builds, "st-link" (transport
# dapdirect_swd) in ST's fork - so naming either one breaks the other. Left
# alone, OpenOCD auto-selects the first transport the adapter supports.

set CHIPNAME stm32h750vbt6

source [find target/stm32h7x.cfg]

# 이 보드에서는 SRST 를 쓰면 안 된다.
#   NRST 를 MAX809TEUR 수퍼바이저가 구동하고 있어서 ST-LINK 가 끌어당겨도
#   halt 타이밍을 잡지 못한다 (실측: "timed out while waiting for target halted").
#   reset_config none 으로 두면 openocd 가 SYSRESETREQ(소프트웨어 리셋)를 쓴다.
#   백업 도메인(RTC 레지스터)은 보존되므로 부트 모드 플래그 복구 경로와도 맞는다.
reset_config none separate

adapter speed 4000

# QUADSPI 를 memory-mapped 읽기 상태로 만든다.
# openocd 의 stmqspi 드라이버는 CR/DCR/CCR 를 읽어 플래시 구성을 파악한다.
#
proc qspi_init { } {
	# RCC_AHB4ENR |= GPIOA..GPIOK  (GPIOB/D/E 가 필요하다)
	mmw 0x580244E0 0x000007FF 0
	# RCC_AHB3ENR |= QSPIEN
	mmw 0x580244D4 0x00004000 0
	sleep 1

	# PB02: CLK(AF9),  PB06: BK1_NCS(AF10)
	# PD11: BK1_IO0(AF9), PD12: BK1_IO1(AF9), PD13: BK1_IO3(AF9)
	# PE02: BK1_IO2(AF9)

	# Port B : PB06:AF10:VeryHigh, PB02:AF09:VeryHigh
	mmw 0x58020400 0x00002020 0x00001010	;# MODER
	mmw 0x58020408 0x00003030 0x00000000	;# OSPEEDR
	mmw 0x5802040C 0x00000000 0x00003030	;# PUPDR
	mmw 0x58020420 0x0A000900 0x05000600	;# AFRL
	# Port D : PD13/PD12/PD11:AF09:VeryHigh
	mmw 0x58020C00 0x0A800000 0x05400000	;# MODER
	mmw 0x58020C08 0x0FC00000 0x00000000	;# OSPEEDR
	mmw 0x58020C0C 0x00000000 0x0FC00000	;# PUPDR
	mmw 0x58020C24 0x00999000 0x00666000	;# AFRH
	# Port E : PE02:AF09:VeryHigh
	mmw 0x58021000 0x00000020 0x00000010	;# MODER
	mmw 0x58021008 0x00000030 0x00000000	;# OSPEEDR
	mmw 0x5802100C 0x00000000 0x00000030	;# PUPDR
	mmw 0x58021020 0x00000900 0x00000600	;# AFRL

	# reset-init 직후이므로 SYSCLK=HSI 64MHz, HCLK=64MHz 다.
	# PRESCALER=3 -> SCK = 64/4 = 16MHz. Read(0x03) 의 50MHz 상한 안에 넉넉히 들어간다.
	#
	# QUADSPI_CR : PRESCALER=3, APMS=1, FSEL=0, DFM=0, SSHIFT=1, TCEN=1, EN=0
	mww 0x52005000 0x03400018
	# QUADSPI_DCR: FSIZE=0x16(8MB), CSHT=4(5 cycles), CKMODE=0
	mww 0x52005004 0x00160400
	# QUADSPI_LPTR: FIFO 가 찬 뒤 4096 클럭이면 CS 해제
	mww 0x52005030 0x00001000
	# QUADSPI_CCR: FMODE=3(memory mapped), DMODE=1, DCYC=0, ADSIZE=2(3바이트), ADMODE=1, IMODE=1, INSTR=Read(0x03)
	mww 0x52005014 0x0D002503
	# QUADSPI_CR: EN=1
	mmw 0x52005000 0x00000001 0

	flash probe 1
}

flash bank qspi0 stmqspi 0x90000000 0 0 0 $_CHIPNAME.cpu0 0x52005000

$_CHIPNAME.cpu0 configure -event reset-init {
	qspi_init
}
