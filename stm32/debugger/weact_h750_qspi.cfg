# WEACT-H750-MINI external QSPI flash, for programming the application.
#
# OpenOCD's stmqspi driver does not talk to the flash chip directly. It pokes
# the MCU's QUADSPI registers over SWD to issue commands, and loads a small
# stub into SRAM for bulk transfers - the MCU is the bridge. That means QUADSPI
# has to be clocked and its pins in alternate function mode before this bank is
# usable, which is what the reset-init handler below arranges.
#
# Winbond W25Q64, 8 MB, memory mapped at 0x90000000.
# QUADSPI base on STM32H7 is 0x52005000.
#
#   BK1_NCS PB6  AF10        CLK  PB2  AF9
#   IO0     PD11 AF9         IO1  PD12 AF9
#   IO2     PE2  AF9         IO3  PD13 AF9

source [find target/stm32h7x.cfg]

$_CHIPNAME.cpu configure -event reset-init {
	# Enable the GPIO and QUADSPI clocks.
	#   RCC_AHB4ENR  0x580244E0 : GPIOB(1) GPIOD(3) GPIOE(4)
	#   RCC_AHB3ENR  0x580244D4 : QSPIEN(14)
	mmw 0x580244E0 0x0000001A 0
	mmw 0x580244D4 0x00004000 0

	# GPIOB: PB2 and PB6 to alternate function (MODER 10)
	#   GPIOB_MODER 0x58020400, AFRL 0x58020420
	mmw 0x58020400 0x00002020 0x00001010
	# PB2 -> AF9, PB6 -> AF10
	mmw 0x58020420 0x0A000900 0x05000600
	# High speed on both (OSPEEDR 11)
	mmw 0x58020408 0x00003030 0

	# GPIOD: PD11, PD12, PD13 to AF9
	#   GPIOD_MODER 0x58020C00, AFRH 0x58020C24, OSPEEDR 0x58020C08
	mmw 0x58020C00 0x0A800000 0x05400000
	mmw 0x58020C24 0x00999000 0x00666000
	mmw 0x58020C08 0x0FC00000 0

	# GPIOE: PE2 to AF9
	#   GPIOE_MODER 0x58021000, AFRL 0x58021020, OSPEEDR 0x58021008
	mmw 0x58021000 0x00000020 0x00000010
	mmw 0x58021020 0x00000900 0x00000600
	mmw 0x58021008 0x00000030 0

	# QUADSPI_CR: reset, then prescaler 2, FIFO threshold 1, enable.
	#   CR 0x52005000, DCR 0x52005004
	mww 0x52005000 0x00000000
	# DCR: FSIZE 22 (8 MB => 2^23, FSIZE = 22), CSHT 1, CKMODE 0
	mww 0x52005004 0x00160100
	mww 0x52005000 0x01000001
}

# 0 0 0 0 -> autodetect size and sector layout from the JEDEC ID
flash bank qspi0 stmqspi 0x90000000 0 0 0 0 $_CHIPNAME.cpu 0x52005000
